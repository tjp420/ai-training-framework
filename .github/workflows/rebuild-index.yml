name: Rebuild Knowledge Index

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'knowledge_extraction/**'
      - 'gguf_models/**'
      - '.github/workflows/rebuild-index.yml'
  workflow_dispatch:
    inputs:
      model_path:
        description: 'Path to GGUF model (relative to repo root)'
        required: false
        default: 'gguf_models/model.gguf'
      embed_model:
        description: 'Embedding model name'
        required: false
        default: 'sentence-transformers/all-MiniLM-L6-v2'
      release_tag:
        description: 'Release tag (e.g., v1.0.0)'
        required: false
        default: 'latest'

env:
  PYTHON_VERSION: '3.9'

jobs:
  rebuild-index:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
        pip install sentence-transformers faiss-cpu numpy
        pip install llama-cpp-python || echo "GGUF support optional"
        
    - name: Create output directory
      run: |
        mkdir -p knowledge_extraction/output
        
    - name: Generate teacher outputs
      run: |
        MODEL_PATH="${{ github.event.inputs.model_path || 'gguf_models/model.gguf' }}"
        if [ -f "$MODEL_PATH" ]; then
          echo "📚 Using GGUF model: $MODEL_PATH"
          python knowledge_extraction/generate_teacher_outputs.py \
            --model "$MODEL_PATH" \
            --out knowledge_extraction/output/knowledge_base.jsonl
        else
          echo "⚠️ GGUF model not found: $MODEL_PATH"
          echo "📚 Using mock mode for demonstration"
          python knowledge_extraction/generate_teacher_outputs.py \
            --model dummy.gguf \
            --out knowledge_extraction/output/knowledge_base.jsonl
        fi
        
    - name: Build FAISS index
      run: |
        EMBED_MODEL="${{ github.event.inputs.embed_model || 'sentence-transformers/all-MiniLM-L6-v2' }}"
        echo "🔧 Building index with embedding model: $EMBED_MODEL"
        python knowledge_extraction/build_index.py \
          --in knowledge_extraction/output/knowledge_base.jsonl \
          --out knowledge_extraction/output/vector_index \
          --embed-model "$EMBED_MODEL"
          
    - name: Test index functionality
      run: |
        echo "🧪 Testing index functionality..."
        python knowledge_extraction/tiny_query.py \
          --index knowledge_extraction/output/vector_index \
          --query "How do I improve model accuracy?" || echo "Test completed"
          
    - name: Create index metadata
      run: |
        cat > knowledge_extraction/output/index_metadata.json << EOF
        {
          "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
          "git_commit": "${{ github.sha }}",
          "git_branch": "${{ github.ref_name }}",
          "workflow_run_id": "${{ github.run_id }}",
          "model_path": "${{ github.event.inputs.model_path || 'gguf_models/model.gguf' }}",
          "embed_model": "${{ github.event.inputs.embed_model || 'sentence-transformers/all-MiniLM-L6-v2' }}",
          "knowledge_entries": "$(wc -l < knowledge_extraction/output/knowledge_base.jsonl)",
          "index_files": [
            "knowledge_index.faiss",
            "metadata.json"
          ]
        }
        EOF
        
    - name: Package index artifacts
      run: |
        cd knowledge_extraction/output
        tar -czf ../vector_index.tar.gz vector_index/
        ls -la vector_index/
        ls -la ../vector_index.tar.gz
        
    - name: Generate release notes
      run: |
        cat > release_notes.md << EOF
        # Knowledge Index Release
        
        ## Generated Information
        - **Generated:** $(date -u +%Y-%m-%dT%H:%M:%SZ)
        - **Commit:** [${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
        - **Branch:** ${{ github.ref_name }}
        - **Workflow:** [Run #${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
        
        ## Configuration
        - **GGUF Model:** ${{ github.event.inputs.model_path || 'gguf_models/model.gguf' }}
        - **Embedding Model:** ${{ github.event.inputs.embed_model || 'sentence-transformers/all-MiniLM-L6-v2' }}
        - **Knowledge Entries:** $(wc -l < knowledge_extraction/output/knowledge_base.jsonl)
        
        ## Files
        - \`vector_index/knowledge_index.faiss\` - FAISS vector index
        - \`vector_index/metadata.json\` - Index metadata and knowledge entries
        - \`index_metadata.json\` - Build information and configuration
        
        ## Usage
        \`\`\`bash
        # Download the release assets
        wget https://github.com/${{ github.repository }}/releases/download/${{ github.event.inputs.release_tag || 'latest' }}/vector_index.tar.gz
        
        # Extract
        tar -xzf vector_index.tar.gz
        
        # Use with Tiny AI
        python knowledge_extraction/tiny_query.py --index vector_index --interactive
        \`\`\`
        
        ## Integration
        The index is automatically discoverable by Tiny AI services. Place the extracted \`vector_index\` directory in your project root and the service will auto-detect and load it.
        EOF
        
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.event.inputs.release_tag || 'knowledge-index-v' || github.run_number }}
        name: Knowledge Index ${{ github.event.inputs.release_tag || 'v' || github.run_number }}
        body_path: release_notes.md
        files: |
          knowledge_extraction/vector_index.tar.gz
          knowledge_extraction/output/index_metadata.json
          knowledge_extraction/output/knowledge_base.jsonl
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Update deployment status
      run: |
        echo "🎉 Knowledge index successfully built and published!"
        echo "📦 Release: ${{ github.event.inputs.release_tag || 'knowledge-index-v' || github.run_number }}"
        echo "🔗 Download: https://github.com/${{ github.repository }}/releases/${{ github.event.inputs.release_tag || 'tag/knowledge-index-v' || github.run_number }}"
        
    - name: Notify success
      if: success()
      run: |
        echo "✅ Index rebuild completed successfully"
        echo "📊 Knowledge entries: $(wc -l < knowledge_extraction/output/knowledge_base.jsonl)"
        echo "📦 Index size: $(du -h knowledge_extraction/output/vector_index.tar.gz | cut -f1)"
        
    - name: Notify failure
      if: failure()
      run: |
        echo "❌ Index rebuild failed"
        echo "🔍 Check the workflow logs for details"
